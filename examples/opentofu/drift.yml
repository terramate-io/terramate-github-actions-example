      #     terramate run \
      #       --status=drifted \
      #       --tags reconcile \
      #       --parallel 5 \
      #       --sync-deployment \
      #       --tofu-plan-file=drift.otplan \
      #       -- \
      #       tofu apply -input=false -auto-approve -lock-timeout=5m drift.otplan
      #   env:
      #     GITHUB_TOKEN: ${{ github.token }}
